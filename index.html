<script>
  let started = false;

  async function startGame() {
    if (started) return;
    started = true;

    try {
      await Nostalgist.launch({
        element: document.getElementById("game"),
        core: "snes9x",
        rom: "https://raw.githubusercontent.com/thePOSTALdude37/Austinssillyshenangins/main/roms/mk2.sfc",

        // 🔥 IMPORTANT FIXES
        fullscreen: false,
        autoStart: true
      });
    } catch (err) {
      console.error("Nostalgist failed:", err);
      alert("Emulator failed to load. Check console.");
    }
  }

  // MUST be a user gesture
  document.addEventListener("click", startGame, { once: true });
</script>
