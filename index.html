<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nostalgist Emulator</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    #game {
      width: 100vw;
      height: 100vh;
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: black;
      color: white;
      font-family: monospace;
      cursor: pointer;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="overlay">click to start</div>
<div id="game"></div>

<script type="module">
  import Nostalgist from "https://unpkg.com/nostalgist/dist/nostalgist.js";

  const overlay = document.getElementById("overlay");
  const game = document.getElementById("game");
  let started = false;

  overlay.addEventListener("click", async () => {
    if (started) return;
    started = true;
    overlay.remove();

    try {
      await Nostalgist.launch({
        element: game,
        core: "snes9x", // NES test (safe)
        rom: "roms/Mortal Kombat II (USA) (Rev 1) (2).sfc",
        autoStart: true
      });
    } catch (e) {
      console.error(e);
      alert("Emulator failed — check console");
    }
  });
</script>

</body>
</html>
