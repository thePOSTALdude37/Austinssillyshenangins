<script>
  let started = false;

  async function startGame() {
    if (started) return;
    started = true;

    document.getElementById("overlay").remove();

    try {
      await Nostalgist.launch({
        element: document.getElementById("game"),
        core: "fceumm",
        rom: "https://raw.githubusercontent.com/thePOSTALdude37/Austinssillyshenangins/main/roms/mk2.sfc",

        // 🔥 CRITICAL FIX
        preferSharedArrayBuffer: false,
        autoStart: true
      });
    } catch (e) {
      console.error(e);
      alert("Emulator failed — check console");
    }
  }

  document.getElementById("overlay").addEventListener("click", startGame);
</script>
