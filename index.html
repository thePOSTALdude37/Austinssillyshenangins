<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Emulator</title>

  <!-- Nostalgist CDN -->
  <script src="https://unpkg.com/nostalgist"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    #game {
      width: 100vw;
      height: 100vh;
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: black;
      color: white;
      font-family: monospace;
      cursor: pointer;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="overlay">click to start</div>
<div id="game"></div>

<script>
  let started = false;

  async function startGame() {
    if (started) return;
    started = true;

    document.getElementById("overlay").remove();

    try {
      await Nostalgist.launch({
        element: document.getElementById("game"),
        core: "snes9x",
        rom: "https://raw.githubusercontent.com/thePOSTALdude37/Austinssillyshenangins/main/roms/mk2.sfc",
        autoStart: true
      });
    } catch (e) {
      console.error(e);
      alert("Emulator failed. Check console.");
    }
  }

  document.getElementById("overlay").addEventListener("click", startGame);
</script>

</body>
</html>
